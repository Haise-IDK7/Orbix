name: Preview Build

# Builds an unsigned Windows installer from main and publishes it as the
# "preview" pre-release, so changes can be tried without a local toolchain.
# Updater artifacts are skipped: they need the upstream signing key.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        run: bunx @tauri-apps/cli build --config src-tauri/tauri.preview.conf.json

      - name: Publish "preview" pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Orbix preview (${GITHUB_SHA::7})" \
            --notes "Unsigned test build of main. Windows SmartScreen will warn: choose More info > Run anyway. Turn off auto-update in Orbix settings, or it will replace this build with the official release."
